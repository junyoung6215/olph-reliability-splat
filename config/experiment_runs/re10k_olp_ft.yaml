name: re10k_olp_ft
stage: train
storage_root: /home/data/olp_h_re10k_slot0/noposplat_runs/re10k
data_root: datasets/re10k
pretrained_weights: ./pretrained_weights/re10k.ckpt
wandb_mode: disabled
cuda_visible_devices: 0
cache_root: /home/data/olp_h_re10k_slot0/runtime_cache
check_env: true
min_free_gb: 30

train:
  max_steps: 300001
  batch_size: 4
  lr: 2e-4
  warmup_steps: 1500
  val_check_interval: 100000000
  num_sanity_val_steps: 0
  ckpt_every: 1000
  save_top_k: 1
  save_weights_only: false
  print_log_every_n_steps: 100
  checkpoint_load: null

data_loader:
  train_num_workers: 16
  val_num_workers: 1
  test_num_workers: 4

olp:
  enabled: true
  mode: hadamard
  dim: 256
  mix: 0.0
  target_mix: 1.0
  warmup_steps: 1500
  seed: 0
  collect_stats: true

eval:
  name: re10k_olp_ft_eval
  index_path: assets/evaluation_index_re10k.json
  save_image: false
  save_olp_stats: true
  olp_enabled: true
  olp_mix: 1.0
  olp_target_mix: 1.0
  olp_tau_alpha: 0.95
  olp_tau_scale: null
  olp_tau_volume: null
  olp_adaptive_tau_scale_quantile: 0.95
