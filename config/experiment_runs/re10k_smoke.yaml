name: re10k_smoke
stage: smoke
storage_root: /home/data/olp_h_re10k_slot0/noposplat_runs/re10k
data_root: datasets/re10k
pretrained_weights: ./pretrained_weights/re10k.ckpt
wandb_mode: disabled
cuda_visible_devices: 0
check_env: true
min_free_gb: 5

train:
  max_steps: 2
  batch_size: 1
  lr: 2e-4
  warmup_steps: 1
  val_check_interval: 100000000
  num_sanity_val_steps: 0
  ckpt_every: 1
  save_top_k: 1
  save_weights_only: false
  print_log_every_n_steps: 1
  checkpoint_load: null

data_loader:
  train_num_workers: 0
  val_num_workers: 0
  test_num_workers: 0

olp:
  enabled: true
  mode: hadamard
  dim: 256
  mix: 0.0
  target_mix: 1.0
  warmup_steps: 1
  seed: 0
  collect_stats: true

eval:
  enabled: false
