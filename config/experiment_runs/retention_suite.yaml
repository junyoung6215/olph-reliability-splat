# Runner settings, NOT a Hydra experiment. Relative paths are repository-relative.
# Copy this file outside Git and change the paths before server experiments.
data_root: /server/datasets/re10k
initial_checkpoint: /server/checkpoints/olp_reliability.ckpt
train_pairs: /server/manifests/train_pairs.json
validation_index: /server/manifests/validation.json
evaluation_index: /server/manifests/held_out_test.json
output_root: /server/outputs/retention

# Restricts each sequential subprocess to ONE GPU. May also be a GPU UUID.
gpu: '0'
seed: 111123
olp_enabled: true
olp_seed: 0
olp_mix: 1.0
reliability_enabled: true
reliability_r_min: 0.05

train:
  finetune_scope: full  # Set heads for frozen-backbone fine-tuning.
  # random: original NoPoSplat bounded pairs over the whole train split (train_pairs unused).
  # fixed: train_pairs manifest; required by the prior arm.
  sampler: random
  steps: 5000
  batch_size: 1
  accumulate: 1
  workers: 0
  lr: 0.00002
  backbone_lr_multiplier: 0.1
  validation_interval: 500
  # Optional training-validation videos; independent of evaluation.save_image.
  validation_videos: false
  checkpoint_interval: 500
  loss_warmup_start: 500
  loss_warmup_end: 1500
  legacy_weight: 0.0001
  prior_weight: 0.001

local:
  cell_size: 16
  detail_strength: 1.0
  min_per_cell: 0

evaluation:
  scores: [random, base_opacity, opacity, reliability]
  ratios: [0.25, 0.5, 0.75]
  align_pose: true
  pose_align_steps: 100
  save_image: false

# Only needed for train --arm prior. Never run a teacher online.
# Actual teacher adapter and real cache generation remain server work.
prior:
  root: null
  teacher_id: ''
  teacher_settings_id: ''
