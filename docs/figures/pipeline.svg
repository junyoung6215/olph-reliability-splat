<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" width="1400" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0F766E"/>
    </marker>
    <style>
      .t  { font-size: 15px; font-weight: 700; fill: #111827; }
      .s  { font-size: 12.5px; fill: #4B5563; }
      .m  { font-size: 12.5px; fill: #374151; font-family: 'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
      .lg { font-size: 13px; fill: #374151; }
      .cap{ font-size: 12px; fill: #0F766E; font-style: italic; }
      .up  { fill: #F3F4F6; stroke: #9CA3AF; stroke-width: 1.5; }
      .olp { fill: #FDF3C4; stroke: #B7950B; stroke-width: 2; }
      .rel { fill: #D7F3EE; stroke: #0F766E; stroke-width: 2; }
      .relT{ fill: #EEFAF7; stroke: #0F766E; stroke-width: 1.5; stroke-dasharray: 6 4; }
      .fl  { fill: none; stroke: #4B5563; stroke-width: 1.8; }
      .flT { fill: none; stroke: #0F766E; stroke-width: 1.8; stroke-dasharray: 6 4; }
    </style>
  </defs>

  <rect x="1" y="1" width="1398" height="438" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- ===================== forward path ===================== -->
  <!-- B1: context views -->
  <rect class="up" x="24" y="110" width="130" height="80" rx="10"/>
  <rect x="58" y="120" width="34" height="24" rx="3" fill="#CBD5E1" stroke="#64748B"/>
  <rect x="68" y="126" width="34" height="24" rx="3" fill="#E2E8F0" stroke="#64748B"/>
  <path d="M71,146 l8,-9 l6,6 l5,-5 l9,8" fill="none" stroke="#64748B" stroke-width="1.2"/>
  <text class="t" x="89" y="168" text-anchor="middle">Context views</text>
  <text class="s" x="89" y="184" text-anchor="middle">I₁, I₂ · no poses</text>

  <!-- B2: encoder-decoder -->
  <rect class="up" x="184" y="110" width="160" height="80" rx="10"/>
  <text class="t" x="264" y="138" text-anchor="middle">ViT enc–dec</text>
  <text class="s" x="264" y="157" text-anchor="middle">cross-view attention</text>
  <text class="s" x="264" y="174" text-anchor="middle">MASt3R init</text>

  <!-- B3: DPT fusion -->
  <rect class="up" x="374" y="110" width="140" height="80" rx="10"/>
  <text class="t" x="444" y="145" text-anchor="middle">DPT fusion</text>
  <text class="s" x="444" y="166" text-anchor="middle">256-ch feature x</text>

  <!-- B4: OLP-H -->
  <rect class="olp" x="544" y="105" width="180" height="90" rx="10"/>
  <text class="t" x="634" y="133" text-anchor="middle">OLP-H</text>
  <text class="m" x="634" y="155" text-anchor="middle">Qx = H·D·P·x / √C</text>
  <text class="s" x="634" y="175" text-anchor="middle">fixed randomized Hadamard</text>

  <!-- B5a: Gaussian head -->
  <rect class="up" x="764" y="52" width="190" height="76" rx="10"/>
  <text class="t" x="859" y="84" text-anchor="middle">Gaussian head</text>
  <text class="s" x="859" y="105" text-anchor="middle">μ, Σ, SH color, opacity α</text>

  <!-- B5b: Reliability head -->
  <rect class="rel" x="764" y="172" width="190" height="76" rx="10"/>
  <text class="t" x="859" y="204" text-anchor="middle">Reliability head</text>
  <text class="m" x="859" y="225" text-anchor="middle">r = r_min+(1−r_min)·σ(a)</text>

  <!-- B6: opacity gating -->
  <rect class="rel" x="994" y="110" width="120" height="80" rx="10"/>
  <text class="t" x="1054" y="145" text-anchor="middle">α′ = α · r</text>
  <text class="s" x="1054" y="166" text-anchor="middle">soft gating</text>

  <!-- B7: renderer -->
  <rect class="up" x="1154" y="110" width="220" height="80" rx="10"/>
  <text class="t" x="1264" y="141" text-anchor="middle">Splatting renderer</text>
  <text class="s" x="1264" y="163" text-anchor="middle">novel view → MSE + LPIPS</text>

  <!-- forward arrows -->
  <path class="fl" d="M154,150 H180" marker-end="url(#arrow)"/>
  <path class="fl" d="M344,150 H370" marker-end="url(#arrow)"/>
  <path class="fl" d="M514,150 H540" marker-end="url(#arrow)"/>
  <path class="fl" d="M724,150 H744 V90 H760" marker-end="url(#arrow)"/>
  <path class="fl" d="M744,150 V210 H760" marker-end="url(#arrow)"/>
  <path class="fl" d="M954,90 H974 V150 H990" marker-end="url(#arrow)"/>
  <path class="fl" d="M954,210 H974 V150"/>
  <path class="fl" d="M1114,150 H1150" marker-end="url(#arrow)"/>

  <!-- ===================== training-only path ===================== -->
  <!-- C1: render context views -->
  <rect class="relT" x="1154" y="320" width="220" height="80" rx="10"/>
  <text class="t" x="1264" y="352" text-anchor="middle">Render context views</text>
  <text class="s" x="1264" y="373" text-anchor="middle">Î_ctx at input cameras</text>

  <!-- C2: residual risk -->
  <rect class="relT" x="974" y="320" width="150" height="80" rx="10"/>
  <text class="t" x="1049" y="346" text-anchor="middle">Residual risk</text>
  <text class="m" x="1049" y="366" text-anchor="middle">|Î_ctx − I_ctx|</text>
  <text class="s" x="1049" y="385" text-anchor="middle">sampled at μ_g</text>

  <!-- C3: reliability loss -->
  <rect class="relT" x="764" y="320" width="190" height="80" rx="10"/>
  <text class="t" x="859" y="346" text-anchor="middle">L_rel</text>
  <text class="m" x="859" y="366" text-anchor="middle">r · sg(α) · sg(risk)</text>
  <text class="s" x="859" y="385" text-anchor="middle">λ=1e-4, warm-up 3k→8k</text>

  <!-- training arrows -->
  <path class="flT" d="M1264,190 V316" marker-end="url(#arrowTeal)"/>
  <path class="flT" d="M1154,360 H1128" marker-end="url(#arrowTeal)"/>
  <path class="flT" d="M974,360 H958" marker-end="url(#arrowTeal)"/>
  <path class="flT" d="M859,320 V252" marker-end="url(#arrowTeal)"/>
  <text class="cap" x="868" y="292">gradient → r only</text>

  <!-- ===================== legend ===================== -->
  <rect class="up"  x="40" y="300" width="22" height="16" rx="4"/>
  <text class="lg" x="72" y="313">NoPoSplat (upstream)</text>
  <rect class="olp" x="40" y="330" width="22" height="16" rx="4"/>
  <text class="lg" x="72" y="343">OLP-H latent preconditioner (ours)</text>
  <rect class="rel" x="40" y="360" width="22" height="16" rx="4"/>
  <text class="lg" x="72" y="373">Gaussian reliability (ours)</text>
  <path class="flT" d="M40,398 H62"/>
  <text class="lg" x="72" y="403">training only · sg = stop-gradient</text>

  <text class="s" x="40" y="262">Gaussians are predicted directly in the canonical frame of view 1 (pose-free, feed-forward).</text>
</svg>
