model:
  encoder:
    backbone:
      name: croco
      model: ViTLarge_BaseDecoder
      patch_embed_cls: PatchEmbedDust3R
      asymmetry_decoder: true
      intrinsics_embed_loc: encoder
      intrinsics_embed_degree: 4
      intrinsics_embed_type: token
    name: noposplat
    opacity_mapping:
      initial: 0.0
      final: 0.0
      warm_up: 1
    num_monocular_samples: 32
    num_surfaces: 1
    predict_opacity: false
    gaussians_per_pixel: 1
    gaussian_adapter:
      gaussian_scale_min: 0.5
      gaussian_scale_max: 15.0
      sh_degree: 4
    d_feature: 128
    visualizer:
      num_samples: 8
      min_resolution: 256
      export_ply: false
    apply_bounds_shim: true
    gs_params_head_type: dpt_gs
    pose_free: true
    pretrained_weights: ./pretrained_weights/MASt3R_ViTLarge_BaseDecoder_512_catmlpdpt_metric.pth
    orthogonal_preconditioner:
      enabled: false
      mode: hadamard
      dim: 256
      mix: 0.0
      target_mix: 1.0
      warmup_steps: 5000
      seed: 0
      collect_stats: false
    gaussian_reliability:
      enabled: false
      r_min: 0.05
      r_init: 0.95
      detach_gate: false
    intrinsics_embed_loc: encoder
    intrinsics_embed_type: token
  decoder:
    make_scale_invariant: true
loss:
  mse:
    weight: 1.0
  lpips:
    weight: 0.05
    apply_after_step: 0
  geo:
    enabled: false
    weight: 0.0
    robust: charbonnier
    charbonnier_eps: 0.001
    visibility_depth_threshold: 0.05
    use_confidence_weight: true
    stop_gradient_anchor: true
    min_valid_pixels: 128
    debug: false
    coordinate_frame: context0
    allow_ambiguous_frame: false
dataset:
  re10k:
    view_sampler:
      index_path: outputs/reliability_residual_eval/nopos_olp_rel_compare/20260609_111408/evaluation_index_re10k_qual10_seed0.json
      name: evaluation
      num_context_views: 2
      num_target_views: 4
      warm_up_steps: 9375
      min_distance_between_context_views: 45
      max_distance_between_context_views: 90
      min_distance_to_context_views: 0
      initial_min_distance_between_context_views: 25
      initial_max_distance_between_context_views: 25
    make_baseline_1: true
    relative_pose: true
    augment: true
    background_color:
    - 0.0
    - 0.0
    - 0.0
    overfit_to_scene: null
    skip_bad_shape: true
    name: re10k
    roots:
    - /home/data/olp_h_re10k_slot0/re10k_hf
    input_image_shape:
    - 256
    - 256
    original_image_shape:
    - 360
    - 640
    cameras_are_circular: false
    baseline_min: 0.001
    baseline_max: 10000000000.0
    max_fov: 100.0
data_loader:
  train:
    num_workers: 0
    persistent_workers: true
    batch_size: 16
    seed: 1234
  test:
    num_workers: 4
    persistent_workers: false
    batch_size: 1
    seed: 2345
  val:
    num_workers: 0
    persistent_workers: true
    batch_size: 1
    seed: 3456
seed: 111123
wandb:
  name: re10k
  tags:
  - re10k
  - 256x256
optimizer:
  lr: 0.0002
  warm_up_steps: 125
  backbone_lr_multiplier: 0.1
trainer:
  max_steps: 18751
  val_check_interval: 500
checkpointing:
  every_n_train_steps: 9375
evaluation:
  methods:
  - name: NoPoSplat
    key: nopos
    path: outputs/reliability_residual_eval/nopos_olp_rel_compare/20260609_111408/qual_eval/re10k_nopos_qual10
  - name: OLP-FT
    key: olp
    path: outputs/reliability_residual_eval/nopos_olp_rel_compare/20260609_111408/qual_eval/re10k_olp300k_qual10
  - name: OLP-Reliability
    key: rel
    path: outputs/reliability_residual_eval/nopos_olp_rel_compare/20260609_111408/qual_eval/re10k_relctx_75k_qual10
  side_by_side_path: outputs/reliability_residual_eval/nopos_olp_rel_compare/20260609_111408/side_by_side/panels
  animate_side_by_side: false
  highlighted:
